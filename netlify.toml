[build]
  publish = "public"

# Redirecionamento da rota raiz para a página inicial
[[redirects]]
  from = "/"
  to = "/inicio/index.html"
  status = 200

# Redirecionamento para index.html das páginas caso acessem a pasta sem barra
[[redirects]]
  from = "/inicio"
  to = "/inicio/index.html"
  status = 200

[[redirects]]
  from = "/pets"
  to = "/pets/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login/index.html"
  status = 200

[[redirects]]
  from = "/cadastro"
  to = "/cadastro/index.html"
  status = 200

[[redirects]]
  from = "/denuncias"
  to = "/denuncias/index.html"
  status = 200

[[redirects]]
  from = "/doacoes"
  to = "/doacoes/index.html"
  status = 200

[[redirects]]
  from = "/doarPet"
  to = "/doarPet/index.html"
  status = 200

[[redirects]]
  from = "/petIA"
  to = "/petIA/index.html"
  status = 200

[[redirects]]
  from = "/perfil"
  to = "/perfil/index.html"
  status = 200

[[redirects]]
  from = "/politica-privacidade"
  to = "/politica-privacidade/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
