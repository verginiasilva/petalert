<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetAlert | Recuperar senha</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .recuperar-card-shell {
            max-width: 480px;
            margin: 2.5rem auto;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 2.4rem 2.2rem;
        }

        .recuperar-header-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 1.25rem;
            background: linear-gradient(135deg, var(--yellow), var(--rose));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 6px 18px rgba(217, 125, 82, 0.2);
        }

        .alert-box {
            padding: 0.95rem 1.15rem;
            border-radius: 14px;
            margin-bottom: 1.5rem;
            font-size: 0.92rem;
            line-height: 1.5;
            display: none;
            align-items: center;
            gap: 0.65rem;
        }

        .alert-box.sucesso {
            background: #ECFDF5;
            border: 1px solid #A7F3D0;
            color: #065F46;
        }

        .alert-box.erro {
            background: #FEE2E2;
            border: 1px solid #FCA5A5;
            color: #991B1B;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .nav-entrar-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)) !important;
            color: #ffffff !important;
            padding: 0.6rem 1.1rem !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 12px rgba(217, 125, 82, 0.2) !important;
        }
    </style>

    <style>
        .recuperar-password-wrap { position: relative; display: flex; align-items: center; width: 100%; }
        .recuperar-password-wrap input { width: 100%; box-sizing: border-box; padding-right: 3rem !important; }
        .recuperar-toggle-senha { position: absolute; right: .65rem; border: 0; background: transparent; cursor: pointer; padding: .35rem; font-size: 1.1rem; color: var(--muted); }
        .recuperar-toggle-senha:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
    </style>

</head>
<body>
    <header class="site-header">
        <a class="brand" href="../inicio/index.html">
            <img src="../img/PetAlert-Logo.png" alt="Logo PetAlert">
            <span>PetAlert</span>
        </a>
        <nav class="site-nav" aria-label="Menu principal">
            <a href="../inicio/index.html">Início</a>
            <a href="../pets/index.html">Pets</a>
            <a href="../cadastro/index.html">Cadastro</a>
            <a href="../denuncias/index.html">Denúncias</a>
            <a href="../doacoes/index.html">Doações</a>
            <a href="../petIA/index.html">Pet.IA</a>
            <a href="../doarPet/index.html">Doar pet</a>
            <a href="../veterinarios/index.html">Veterinário</a>
            <a href="index.html" class="nav-entrar-btn">Entrar</a>
        </nav>
    </header>

    <main>
        <section class="page-shell">
            <div class="recuperar-card-shell">
                <div style="text-align: center; margin-bottom: 1.75rem;">
                    <div class="recuperar-header-icon">🔑</div>
                    <h1 style="font-size: 1.85rem; color: var(--text); margin: 0 0 0.5rem; font-weight: 800;">Recuperar senha</h1>
                    <p style="color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0;">
                        Confirme os dados cadastrados na sua conta para criar uma nova senha diretamente no PetAlert.
                    </p>
                </div>

                <!-- Caixa de Mensagem / Feedback -->
                <div id="mensagemFeedback" class="alert-box"></div>

                <form id="formRecuperarSenha" novalidate>
                    <div class="form-group">
                        <label for="email" style="font-weight: 600; color: var(--text);">E-mail Cadastrado</label>
                        <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email" required style="width: 100%; box-sizing: border-box;">
                    </div>
                    <div class="form-group" style="margin-top: 1rem;">
                        <label for="cpf" style="font-weight: 600; color: var(--text);">CPF cadastrado</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" autocomplete="off" required maxlength="14" style="width: 100%; box-sizing: border-box;">
                    </div>
                    <div class="form-group" style="margin-top: 1rem;">
                        <label for="dataNascimento" style="font-weight: 600; color: var(--text);">Data de nascimento</label>
                        <input type="date" id="dataNascimento" required style="width: 100%; box-sizing: border-box;">
                    </div>

                    <button type="submit" id="btnEnviar" class="primary-btn" style="width: 100%; margin-top: 1.25rem; font-size: 1rem; padding: 0.9rem; font-weight: 700; border-radius: 14px;">
                        Verificar meus dados
                    </button>

                    <div id="camposNovaSenha" style="display:none; margin-top:1.25rem;">
                        <div class="form-group">
                            <label for="novaSenha" style="font-weight:600; color:var(--text);">Nova senha</label>
                            <div class="recuperar-password-wrap">
                                <input type="password" id="novaSenha" minlength="6" autocomplete="new-password" placeholder="Mínimo de 6 caracteres">
                                <button type="button" class="recuperar-toggle-senha" data-target="novaSenha" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">👁️</button>
                            </div>
                        </div>
                        <div class="form-group" style="margin-top:1rem;">
                            <label for="confirmarSenha" style="font-weight:600; color:var(--text);">Confirmar nova senha</label>
                            <div class="recuperar-password-wrap">
                                <input type="password" id="confirmarSenha" minlength="6" autocomplete="new-password" placeholder="Digite novamente">
                                <button type="button" class="recuperar-toggle-senha" data-target="confirmarSenha" aria-label="Mostrar confirmação de senha" aria-pressed="false" title="Mostrar confirmação de senha">👁️</button>
                            </div>
                        </div>
                        <button type="button" id="btnSalvarSenha" class="primary-btn" style="width:100%; margin-top:1.25rem; font-size:1rem; padding:.9rem; font-weight:700; border-radius:14px;">
                            Salvar nova senha
                        </button>
                    </div>

                    <div style="border-top: 1px solid var(--border); margin: 1.6rem 0 1rem;"></div>

                    <p style="text-align: center; font-size: 0.95rem; margin: 0;">
                        Lembrou a senha? <a href="index.html" style="color: var(--primary-dark); font-weight: 700; text-decoration: none;">Voltar ao login</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 PetAlert - Plataforma de Proteção & Adoção de Animais.</p>
    </footer>

    <script src="../auth-ui.js"></script>
    <script>
        const form = document.getElementById('formRecuperarSenha');
        const emailInput = document.getElementById('email');
        const cpfInput = document.getElementById('cpf');
        const dataNascimentoInput = document.getElementById('dataNascimento');
        const btnEnviar = document.getElementById('btnEnviar');
        const camposNovaSenha = document.getElementById('camposNovaSenha');
        const btnSalvarSenha = document.getElementById('btnSalvarSenha');
        const mensagemFeedback = document.getElementById('mensagemFeedback');
        let chaveRecuperacao = '';

        // Permite visualizar/ocultar as senhas durante a redefinição.
        document.querySelectorAll('.recuperar-toggle-senha').forEach((botao) => {
            botao.addEventListener('click', () => {
                const campo = document.getElementById(botao.dataset.target);
                if (!campo) return;
                const mostrar = campo.type === 'password';
                campo.type = mostrar ? 'text' : 'password';
                botao.textContent = mostrar ? '🙈' : '👁️';
                botao.title = mostrar ? 'Ocultar senha' : 'Mostrar senha';
                botao.setAttribute('aria-label', botao.title);
                botao.setAttribute('aria-pressed', String(mostrar));
            });
        });

        function exibirMensagem(tipo, texto) {
            mensagemFeedback.className = 'alert-box ' + tipo;
            mensagemFeedback.style.display = 'flex';
            const icone = document.createElement('span');
            icone.textContent = tipo === 'sucesso' ? '✅' : '⚠️';
            const textoEl = document.createElement('span');
            textoEl.textContent = texto;
            mensagemFeedback.replaceChildren(icone, textoEl);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (chaveRecuperacao) return;
            const email = emailInput.value.trim();
            const cpf = cpfInput.value.trim();
            const data_nascimento = dataNascimentoInput.value;
            if (!email || !cpf || !data_nascimento) {
                exibirMensagem('erro', 'Preencha o e-mail, CPF e data de nascimento.');
                return;
            }
            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Verificando dados...';
            try {
                const response = await fetch('../index.php?rota=auth&acao=recuperar-senha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email, cpf, data_nascimento })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.status !== 'sucesso' || !data.chave) {
                    exibirMensagem('erro', data.mensagem || 'Não foi possível confirmar os dados.');
                    return;
                }
                chaveRecuperacao = data.chave;
                emailInput.disabled = true;
                cpfInput.disabled = true;
                dataNascimentoInput.disabled = true;
                btnEnviar.style.display = 'none';
                camposNovaSenha.style.display = 'block';
                exibirMensagem('sucesso', data.mensagem || 'Dados confirmados. Cadastre sua nova senha.');
            } catch (err) {
                console.error(err);
                exibirMensagem('erro', 'Não foi possível conectar ao servidor. Tente novamente.');
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Verificar meus dados';
            }
        });

        btnSalvarSenha.addEventListener('click', async () => {
            const senha = document.getElementById('novaSenha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;
            if (senha.length < 6) {
                exibirMensagem('erro', 'A senha deve possuir pelo menos 6 caracteres.');
                return;
            }
            if (senha !== confirmarSenha) {
                exibirMensagem('erro', 'As senhas não coincidem.');
                return;
            }
            btnSalvarSenha.disabled = true;
            btnSalvarSenha.textContent = 'Salvando senha...';
            try {
                const response = await fetch('../index.php?rota=auth&acao=redefinir-senha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ chave: chaveRecuperacao, senha, confirmarSenha })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.status !== 'sucesso') {
                    exibirMensagem('erro', data.mensagem || 'Não foi possível salvar a nova senha.');
                    return;
                }
                exibirMensagem('sucesso', data.mensagem || 'Senha alterada com sucesso.');
                camposNovaSenha.style.display = 'none';
                const link = document.createElement('a');
                link.href = 'index.html';
                link.textContent = ' Ir para o login';
                link.style.cssText = 'color:var(--primary-dark);font-weight:700;margin-left:5px;';
                mensagemFeedback.appendChild(link);
                chaveRecuperacao = '';
            } catch (err) {
                console.error(err);
                exibirMensagem('erro', 'Não foi possível conectar ao servidor. Tente novamente.');
            } finally {
                btnSalvarSenha.disabled = false;
                btnSalvarSenha.textContent = 'Salvar nova senha';
            }
        });
    </script>
</body>
</html>
